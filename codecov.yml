# Codecov configuration.
#
# E2E specs, configs, and generated/tooling files are not unit-tested and must
# not count toward coverage. Patch coverage is reported but does not block PRs
# (it's the most common false-blocker, e.g. for test-infra PRs); project
# coverage keeps a small threshold so trivial fluctuations don't fail the check.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true

ignore:
  - 'frontend/e2e/**'
  - 'frontend/playwright.config.ts'
  - '**/*.config.{ts,js,mjs,cjs}'
  - '**/__tests__/**'
  - '**/*.test.{ts,tsx}'
  - 'backend/prisma/**'
  - 'backend/src/generated/**'
